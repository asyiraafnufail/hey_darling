name: Supabase Free Tier Keep-Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pukul 00:00 UTC (mencegah auto-pause 7 hari)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan eksekusi manual kapan saja

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive RPC
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Error: Secrets SUPABASE_URL atau SUPABASE_ANON_KEY belum dikonfigurasi di GitHub Secrets."
            exit 1
          fi

          echo "Mengirim ping RPC keep_alive ke Supabase..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Keep-alive berhasil! Supabase project aktif."
          else
            echo "Gagal ping Supabase. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
